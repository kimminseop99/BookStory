<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white to-blue-50 min-h-screen py-12 px-4 sm:px-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl transition hover:shadow-2xl">
        <h1 class="text-3xl font-bold text-blue-800 mb-6 flex items-center gap-2">
            1:1 문의 작성
        </h1>

        <form th:action="@{/inquiry/form}" method="post" th:object="${inquiry}" class="space-y-6">
            <!-- 제목 입력 -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">제목</label>
                <input id="title" type="text" th:field="*{title}" placeholder="제목을 입력해주세요"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none"/>
            </div>

            <!-- 내용 입력 -->
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">문의 내용</label>
                <textarea id="content" th:field="*{content}" rows="6" placeholder="문의 내용을 입력해주세요"
                          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none resize-none"></textarea>
            </div>

            <!-- 비공개 체크박스 -->
            <div class="flex items-center">
                <input id="private" type="checkbox" th:field="*{private}"
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="private" class="ml-2 text-sm text-gray-700">비공개 문의</label>
            </div>

            <!-- 제출 버튼 -->
            <div class="pt-4">
                <button type="submit"
                        class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition">
                    제출하기
                </button>
            </div>
        </form>
    </div>
</div>
</html>
