<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white text-gray-900 min-h-screen p-6 sm:px-6">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-8 sm:p-10">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-extrabold text-blue-800 flex items-center gap-2">
                <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M8 10h.01M12 10h.01M16 10h.01M9 16h6m2 4H7a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v12a2 2 0 01-2 2z"/>
                </svg>
                문의 상세 보기
            </h1>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-600 mb-1">제목</label>
            <p class="text-xl font-semibold text-gray-900" th:text="${inquiry.title}">문의 제목</p>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-600 mb-1">내용</label>
            <div class="whitespace-pre-line bg-gray-50 border border-gray-200 text-base text-gray-800 rounded-xl p-5">
                <span th:text="${inquiry.content}">문의 내용</span>
            </div>
        </div>

        <div class="mt-10 flex justify-end">
            <a href="/inquiry/my"
               class="inline-flex items-center gap-2 bg-blue-600 text-white font-semibold px-5 py-2.5 rounded-xl shadow-md hover:bg-blue-700 transition">
                ← 목록으로
            </a>
        </div>
    </div>
</div>
</html>
