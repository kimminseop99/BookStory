<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white to-blue-50 text-gray-900 min-h-screen py-12 px-4 sm:px-8">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold text-blue-800 mb-8 flex items-center gap-2">
            <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" stroke-width="2"
                 viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M8 10h.01M12 10h.01M16 10h.01M9 16h6m2 4H7a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v12a2 2 0 01-2 2z"/>
            </svg>
            나의 문의 목록
        </h2>

        <div class="space-y-4" th:if="${#lists.size(inquiries) > 0}">
            <div th:each="inquiry : ${inquiries}"
                 class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition flex justify-between items-center">
                <div>
                    <a th:href="@{/inquiry/view/{id}(id=${inquiry.id})}"
                       class="text-lg font-semibold text-blue-700 hover:underline block">
                        [[${inquiry.title}]]
                    </a>
                    <p class="text-sm text-gray-500 mt-1">[[${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}]]</p>
                </div>
                <span th:if="${inquiry.private}" class="text-sm text-red-500 font-medium ml-4">비공개</span>
            </div>
        </div>

        <!-- 문의가 없을 때 -->
        <div th:if="${#lists.isEmpty(inquiries)}" class="bg-white text-center py-16 rounded-xl shadow text-gray-500">
            아직 작성한 문의가 없습니다.
        </div>
    </div>
</div>
</html>
