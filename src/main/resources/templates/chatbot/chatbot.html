<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white to-blue-50 text-gray-900 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6 space-y-4">
        <h2 class="text-2xl font-bold text-blue-600">📩 챗봇 상담</h2>

        <div id="chat-log" class="space-y-2 max-h-92 overflow-y-auto p-2 border rounded-lg bg-gray-100">
            <!-- 채팅 메시지들 -->
        </div>

        <div class="flex mt-4">
            <input type="text" id="bot-input" placeholder="무엇을 도와드릴까요?"
                   class="flex-1 p-2 border border-blue-300 rounded-l-lg focus:outline-none">
            <button onclick="askBot()"
                    class="px-4 py-2 bg-blue-500 text-white font-semibold rounded-r-lg hover:bg-blue-600">
                질문하기
            </button>
        </div>
    </div>

    <script>
        async function askBot() {
            const input = document.getElementById('bot-input');
            const question = input.value.trim();
            if (!question) return;

            appendMessage('user', question);
            input.value = '';

            try {
                const response = await fetch('http://localhost:8090/api/chatbot/ask', {  // 포트 명시
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    appendMessage('bot', '⚠️ 서버에서 응답을 받을 수 없습니다.');
                    return;
                }

                const data = await response.json();
                console.log("서버 응답:", data);

                const reply = data.reply || "⚠️ 응답을 이해할 수 없습니다.";
                appendMessage('bot', reply);

            } catch (error) {
                console.error('에러 발생:', error);
                appendMessage('bot', '❌ 에러가 발생했어요. 나중에 다시 시도해주세요.');
            }
        }

        function appendMessage(sender, text) {
            const chatLog = document.getElementById('chat-log');
            const message = document.createElement('div');
            message.className = sender === 'user' ? 'text-right' : 'text-left';

            message.innerHTML = `<span class="${sender === 'user' ? 'bg-blue-200 text-blue-900' : 'bg-gray-300 text-gray-800'}
                inline-block px-4 py-2 rounded-xl max-w-[75%] break-words">${text}</span>`;

            chatLog.appendChild(message);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</div>
</html>
