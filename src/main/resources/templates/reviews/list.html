<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-10">
        <h1 class="text-4xl font-bold text-center mb-10">독후감 목록</h1>

        <div class="flex justify-end mb-10 mx-32">
            <a th:href="@{/reviews/create}"
               class="inline-block px-6 py-3 bg-blue-600 text-white rounded-full text-sm font-semibold shadow hover:bg-blue-700 transition duration-300">
                독후감 쓰기
            </a>
        </div>

        <!-- 독후감 없을 때 메시지 -->
        <div th:if="${#lists.isEmpty(reviewList)}" class="text-center text-gray-500 text-lg mt-10">
            작성된 독후감이 없습니다.
        </div>

        <!-- 독후감 리스트 -->
        <div th:if="${not #lists.isEmpty(reviewList)}"
             class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <div th:each="review : ${reviewList}"
                 class="bookreview-card bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-100">
                <a th:href="@{/reviews/detail/{id}(id=${review.id})}"
                   th:text="${(review.secret && #authentication.name != review.writer.username) ? '비밀글입니다.' : review.title}"
                   class="block text-xl font-semibold text-blue-700 hover:underline truncate">
                </a>
                <p class="text-sm text-gray-500 mt-2">
                    작성자: <span th:text="${review.writer.username}">작성자</span><br>
                    작성일: <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                </p>
            </div>
        </div>
    </div>
</div>
</html>
