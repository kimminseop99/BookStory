<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white to-blue-50 text-gray-900 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-12 relative">

        <!-- 제목 -->
        <h1 class="text-4xl font-extrabold text-blue-800 mb-6 text-center drop-shadow"
            th:text="${review.secret && #authentication.name != review.writer.username ? '🔒 비밀글입니다.' : review.title}">
            독후감 제목
        </h1>

        <!-- 메타 정보 -->
        <div class="flex flex-wrap justify-center gap-4 text-sm text-gray-600 mb-6">
            <span class="flex items-center gap-1">👤 <span th:text="${review.writer.username}">작성자</span></span>
            <span>|</span>
            <span class="flex items-center gap-1">🗓 <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span></span>
            <span>|</span>
            <span class="flex items-center gap-1">
                <span>🔐 비밀글:</span>
                <i th:if="${review.secret}" data-lucide="lock" class="w-4 h-4 text-red-500"></i>
                <i th:unless="${review.secret}" data-lucide="unlock" class="w-4 h-4 text-green-500"></i>
            </span>
            <span>|</span>
            <span class="flex items-center gap-1">👁️ <span th:text="${review.viewCount}">0</span></span>
        </div>

        <!-- 해시태그 -->
        <div th:if="${review.hashtags != null}" class="flex flex-wrap justify-center gap-2 mb-6">
            <span th:each="tag : ${#strings.arraySplit(review.hashtags, ',')}"
                  class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full shadow-sm">
                <span th:text="${tag.trim()}">#예시태그</span>
            </span>
        </div>

        <!-- 본문 -->
        <div class="mt-8 text-lg leading-relaxed bg-white p-6 rounded-2xl shadow-xl whitespace-pre-line border border-blue-100"
             th:if="${!review.secret || #authentication.name == review.writer.username}"
             th:text="${review.content}">
            독후감 내용
        </div>

        <!-- 비밀글 안내 -->
        <div th:if="${review.secret && #authentication.name != review.writer.username}"
             class="text-center text-red-600 font-semibold mt-12 text-lg">
            🔒 이 글은 비밀글입니다. 열람 권한이 없습니다.
        </div>

        <!-- 공감 버튼 및 수 -->
        <div class="mt-10 flex justify-center"  sec:authorize="isAuthenticated()" th:if="${!review.secret}">
            <form th:action="@{/reviews/vote/{id}(id=${review.id})}" method="post"
                  th:if="${#authentication.name != null and #authentication.name != review.writer.username}">
                <button type="submit"
                        class="flex items-center gap-2 px-6 py-2 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full shadow transition">
                    ❤️ 공감하기
                    <span class="text-white font-medium text-base"
                          th:text="${review.voter.size()}">0</span>
                </button>
            </form>
            <div th:if="${#authentication.name == review.writer.username}"
                 class="text-sm text-gray-500 font-semibold flex items-center gap-1">
                ❤️ 공감 수: <span th:text="${review.voter.size()}">0</span>
            </div>
        </div>


        <!-- 버튼 영역 -->
        <div class="mt-10 flex justify-center gap-6 items-center">
            <a th:if="${#authentication.name == review.writer.username}"
               th:href="@{/reviews/edit/{id}(id=${review.id})}"
               class="px-5 py-2 bg-yellow-400 hover:bg-yellow-500 text-white font-semibold rounded-full shadow">
                ✏️ 수정
            </a>

            <form th:if="${#authentication.name == review.writer.username}"
                  th:action="@{/reviews/delete/{id}(id=${review.id})}" method="post">
                <button type="submit"
                        class="px-5 py-2 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-full shadow"
                        onclick="return confirm('정말 삭제하시겠습니까?');">
                    🗑 삭제
                </button>
            </form>

            <a th:href="@{/reviews/list}"
               class="px-5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded-full shadow">
                📚 목록으로
            </a>


        </div>

        <!-- 댓글 섹션 -->
        <div class="mt-16">
            <!-- 댓글 제목 -->
            <h2 class="text-2xl font-bold text-blue-800 mb-6">💬 댓글</h2>

            <!-- 로그인 유도 -->
            <div sec:authorize="isAnonymous()" class="text-gray-600 text-sm mt-4">
                댓글을 작성하려면 <a href="/user/login" class="text-blue-600 underline">로그인</a>이 필요합니다.
            </div>

            <!-- 댓글 작성 폼 -->
            <form th:action="@{/comment/create/{id}(id=${review.id})}" method="post" th:object="${commentForm}"
                  class="space-y-4" sec:authorize="isAuthenticated()">

                <div>
        <textarea th:field="*{content}" placeholder="댓글을 입력하세요..."
                  class="w-full p-4 border border-gray-300 rounded-2xl resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"
                  rows="3"></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
                         class="text-red-500 text-sm mt-1"></div>
                </div>

                <!-- 버튼을 오른쪽 정렬하는 flex 컨테이너 추가 -->
                <div class="flex justify-end">
                    <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-semibold transition">
                        작성
                    </button>
                </div>
            </form>




            <!-- 댓글 목록 -->
            <div class="mt-10 space-y-6">
                <div th:each="comment : ${review.comments}" class="bg-white border border-gray-200 p-4 rounded-2xl shadow">
                    <div class="flex justify-between items-center mb-2">
                        <div class="text-sm text-gray-600">
                            👤 <span th:text="${comment.writer.username}">작성자</span>
                            · 🕒 <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                        </div>

                        <!-- 삭제 버튼 -->
                        <div th:if="${#authentication.name == comment.writer.username}" class="flex gap-2">
                            <form th:action="@{/comment/delete/{id}(id=${comment.id})}" method="post"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <button type="submit" class="text-red-500 hover:text-red-700 text-sm font-medium">삭제</button>
                            </form>
                        </div>
                    </div>
                    <div class="text-gray-800 whitespace-pre-line" th:text="${comment.content}">댓글 내용</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</div>
</html>
