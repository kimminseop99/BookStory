<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white text-gray-900 min-h-screen p-6">
    <div class="mx-auto px-4 py-16">
        <h1 class="text-3xl font-bold text-center mb-8 mt-10">고객센터</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- FAQ -->
            <a href="/faq/list" class="group block bg-white rounded-2xl p-6 shadow hover:shadow-lg transition-all">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-blue-600">자주 묻는 질문</h2>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
                <p class="text-gray-600">가장 자주 묻는 질문과 답변을 확인하세요.</p>
            </a>

            <!-- 1:1 문의 -->
            <a href="/inquiry/form" class="group block bg-white rounded-2xl p-6 shadow hover:shadow-lg transition-all">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-blue-600">1:1 문의</h2>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
                <p class="text-gray-600">상담원이 직접 답변드리는 문의를 남겨보세요.</p>
            </a>

            <!-- 실시간 채팅 -->
            <a th:href="@{/chat/index}" class="group block bg-white rounded-2xl p-6 shadow hover:shadow-lg transition-all">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-blue-600">실시간 채팅 상담</h2>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
                <p class="text-gray-600">상담원과 실시간으로 채팅할 수 있어요.</p>
            </a>

            <!-- 챗봇 문의 -->
            <a th:href="@{/chatbot/chatbot}" class="group block bg-white rounded-2xl p-6 shadow hover:shadow-lg transition-all">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xl font-semibold group-hover:text-blue-600">챗봇 문의</h2>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                    </svg>
                </div>
                <p class="text-gray-600">챗봇에게 빠르게 질문해보세요.</p>
            </a>

        </div>

    </div>

</div>
</html>
