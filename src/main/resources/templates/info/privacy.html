<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white text-gray-900 min-h-screen p-6">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold text-blue-700 mb-6">개인정보처리방침</h1>
        <p class="mb-4">BookStory는 이용자의 개인정보 보호를 매우 중요시하며, 「개인정보 보호법」을 준수합니다.</p>

        <h2 class="text-2xl font-semibold mt-6 mb-2">1. 수집하는 개인정보 항목</h2>
        <ul class="list-disc ml-6 mb-4">
            <li>필수: 이메일, 사용자명, 비밀번호</li>
            <li>선택: 프로필 이미지, 자기소개</li>
        </ul>

        <h2 class="text-2xl font-semibold mt-6 mb-2">2. 개인정보 수집 및 이용 목적</h2>
        <ul class="list-disc ml-6 mb-4">
            <li>회원 식별 및 서비스 이용 관리</li>
            <li>서비스 개선 및 개인 맞춤형 콘텐츠 제공</li>
        </ul>

        <h2 class="text-2xl font-semibold mt-6 mb-2">3. 보유 및 이용 기간</h2>
        <p class="mb-4">회원 탈퇴 시까지 보유하며, 법령에 따라 일정 기간 보관될 수 있습니다.</p>

        <p class="mt-8 text-sm text-gray-500">* 개인정보 보호 관련 문의는 고객센터 또는 이메일로 접수해 주세요.</p>
    </div>
</div>
</html>
