<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white text-gray-900 min-h-screen p-6">
    <div class="mx-auto px-4 py-16">
        <div class="max-w-5xl mx-auto px-6 py-12">
            <h1 class="text-4xl font-bold text-blue-700 mb-6">회사소개</h1>
            <p class="text-lg mb-4">BookStory는 책을 사랑하는 모든 이들을 위한 독후감 공유 플랫폼입니다.</p>
            <p class="mb-4">우리는 단순한 독서 기록을 넘어, 책을 매개로 사람과 사람이 연결되기를 꿈꿉니다. 누구나 자유롭게 자신의 감상을 나누고, 서로의 생각을 존중하는 커뮤니티를 지향합니다.</p>
            <p class="mb-4">BookStory는 독서문화의 확산과 가치 있는 기록의 보존을 위해 꾸준히 노력하고 있으며, 사용자 중심의 깨끗하고 따뜻한 서비스를 만들어 갑니다.</p>
            <p class="mt-8 text-sm text-gray-500">📚 함께 써 내려가는 독서 이야기, BookStory</p>
        </div>
    </div>
</div>
</html>
