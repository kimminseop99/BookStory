<header th:fragment="headerFragment" class="bg-[#3B82F6] shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <!-- 로고 -->
        <h1 class="text-2xl md:text-3xl font-extrabold text-white flex items-center">
            <a href="/main" class="flex items-center space-x-2">
                <img th:src="@{/images/main/BookStory_logo.png}" alt="Book Story 로고" class="w-28 h-28 object-contain drop-shadow-lg" />
            </a>
        </h1>

        <!-- 독후감 버튼 -->
        <a th:href="@{/reviews/list}" class="text-white text-sm font-medium px-5 py-2 rounded-md transition hover:bg-gray-500">
            독후감
        </a>

        <!-- 중앙 검색창 -->
        <div class="flex mx-4 flex-1 justify-center">
            <form action="/search" method="get" onsubmit="encodeSearchQuery()" class="w-full max-w-md">
                <div class="flex rounded-full shadow-md overflow-hidden border border-white bg-white">
                    <input type="text" id="searchQuery" name="query" placeholder="책 검색"
                           class="w-full px-5 py-2 text-sm text-gray-700 focus:outline-none"
                           required>
                    <button type="submit"
                            class="flex items-center justify-center px-4 bg-white text-blue-600 hover:text-blue-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18.5a7.5 7.5 0 006.15-3.85z" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- 로그인/회원 메뉴 -->
        <div class="flex items-center space-x-4">
            <!-- 비로그인 시 -->
            <div class="flex items-center space-x-2" sec:authorize="isAnonymous()">
                <a th:href="@{/user/login}" class="px-4 py-2 text-white hover:underline transition">
                    로그인
                </a>
            </div>

            <!-- 로그인 시 -->
            <div class="relative" sec:authorize="isAuthenticated()">
                <span th:text="${#authentication.name} + ' 님'"
                      class="max-w-[7ch] truncate text-sm text-white mr-2 hidden sm:inline-block"></span>
                <button id="userMenuButton" onclick="toggleDropdown()" class="p-2 rounded-full bg-white text-blue-600 hover:bg-blue-100 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.5"
                         stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </button>

                <!-- 드롭다운 메뉴 -->
                <div id="userDropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg ring-1 ring-blue-200 z-50">
                    <a th:href="@{/user/mypage}" class="block px-4 py-3 text-sm text-gray-700 hover:bg-blue-100 transition">마이페이지</a>
                    <a th:href="@{/reviews/list}" class="block px-4 py-3 text-sm text-gray-700 hover:bg-blue-100 transition">내가 쓴 독후감</a>
                    <a th:href="@{/user/logout}" class="block px-4 py-3 text-sm text-red-600 hover:bg-red-100 transition">로그아웃</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 드롭다운 제어 및 검색 인코딩 -->
    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById("userDropdownMenu");
            dropdown.classList.toggle("hidden");
        }

        function encodeSearchQuery() {
            const input = document.getElementById("searchQuery");
            input.value = encodeURIComponent(input.value.trim());
        }

        document.addEventListener('click', function (event) {
            const dropdown = document.getElementById("userDropdownMenu");
            const button = document.getElementById("userMenuButton");
            if (!button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.add("hidden");
            }
        });
    </script>
</header>
