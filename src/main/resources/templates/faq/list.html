<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gradient-to-br from-white text-gray-900 min-h-screen p-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">자주 묻는 질문 (FAQ)</h1>

        <ul class="space-y-4">
            <li th:each="faq : ${faqList}">
                <a th:href="@{/faq/view/{id}(id=${faq.id})}"
                   class="block bg-white p-4 rounded-xl shadow hover:shadow-lg transition duration-200 border-l-4 border-blue-500 hover:border-blue-700">
                    <div class="text-lg font-semibold text-blue-600">[[${faq.question}]]</div>
                    <div class="text-sm text-gray-500 mt-1">카테고리: [[${faq.category}]]</div>
                </a>
            </li>
        </ul>
    </div>
</div>
</html>
