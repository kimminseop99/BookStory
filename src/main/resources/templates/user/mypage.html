<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="container mx-auto px-4 py-12">
    <h1 class="text-3xl font-extrabold text-blue-700 mb-6 flex items-center gap-2">
         마이페이지
    </h1>

    <div class="space-y-6">
        <div class="p-6 bg-white rounded-2xl shadow-md">
            <p class="text-gray-700 text-base"><strong class="text-gray-800">아이디:</strong> <span th:text="${user.username}"></span></p>
            <p class="text-gray-700 text-base"><strong class="text-gray-800">이메일:</strong> <span th:text="${user.email}"></span></p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4">
            <a href="/user/change-password"
               class="bg-blue-500 text-white px-5 py-3 rounded-lg font-medium text-center hover:bg-blue-600 transition">
                비밀번호 변경
            </a>
            <a href="/user/my-reviews"
               class="bg-blue-100 text-blue-700 px-5 py-3 rounded-lg font-medium text-center hover:bg-blue-200 transition">
                내가 쓴 독후감
            </a>
        </div>
    </div>
</div>
</html>
