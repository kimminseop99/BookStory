<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="bg-gray-50 min-h-screen py-12">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-extrabold text-blue-700 mb-8 flex items-center gap-2">
             내가 작성한 독후감
        </h2>

        <div th:if="${#lists.isEmpty(myReviews)}" class="text-gray-600 text-center py-20 text-lg">
            아직 작성한 독후감이 없습니다.
        </div>

        <div class="grid gap-5 sm:grid-cols-2 md:grid-cols-3" th:unless="${#lists.isEmpty(myReviews)}">
            <div th:each="review : ${myReviews}"
                 class="bg-white p-5 rounded-2xl shadow-md hover:shadow-lg transition duration-200">
                <a th:href="@{/reviews/detail/{id}(id=${review.id})}"
                   th:text="${review.title}"
                   class="block text-lg font-semibold text-blue-600 hover:underline truncate"></a>
                <div class="text-sm text-gray-500 mt-2">
                    작성일: <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
