<html layout:decorate="~{layout/layout}">
<div layout:fragment="content" class="container mx-auto max-w-md px-6 py-12 bg-white rounded-2xl shadow-md">
    <h2 class="text-2xl font-extrabold text-blue-600 mb-6 flex items-center gap-2">
        <span>🔐</span> 비밀번호 변경
    </h2>

    <form th:action="@{/user/change-password}" method="post" class="space-y-5">
        <input type="password" name="oldPassword" placeholder="기존 비밀번호"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        <input type="password" name="newPassword" placeholder="새 비밀번호"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <button type="submit"
                class="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white font-semibold py-3 rounded-lg hover:from-blue-600 hover:to-blue-800 transition duration-200">
            비밀번호 변경
        </button>
    </form>

    <div th:if="${errorMessage}" class="text-red-500 mt-4 text-sm" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="text-green-500 mt-4 text-sm" th:text="${successMessage}"></div>
</div>
</html>
